server:
  port: ${MARKET_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: market-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 종목 마스터 · 1분봉 조회 (CLAUDE.md §22, §23, §57.1). 쓰는 쪽은 market-ingest 다.
  # 스키마는 market-core 의 Flyway 마이그레이션이다. 두 앱 모두 기동 시 적용을 시도하고, Flyway 잠금이 한쪽만 적용하게 한다.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_MARKET_DATABASE:wts_market}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:wts}
    password: ${MYSQL_PASSWORD:wts}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: market-service-pool
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # Valkey – 최신 시세/호가 · 현재 1분봉 읽기, WebSocket fan-out 구독 (CLAUDE.md §18, §66.3)
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 2s

market:
  # 화면이 보는 종목을 Valkey에 시청 수요로 기록한다 (CLAUDE.md §57.2, §67).
  # market-ingest가 읽어 실제 시세를 받지 않는 종목의 모의 시세를 만든다.
  demand:
    # 기록 하나의 수명. 화면을 닫은 뒤 이만큼 지나면 모의 시세도 멈춘다. 하트비트보다 넉넉히 길게 둔다.
    viewer-ttl: 30s
    # 구독 중인 종목의 수요를 다시 기록하는 주기
    heartbeat-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
