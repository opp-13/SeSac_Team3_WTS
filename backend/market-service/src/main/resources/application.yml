server:
  port: ${MARKET_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: market-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 종목 마스터 · 1분봉 조회 (CLAUDE.md §22, §23, §57.1). 쓰는 쪽은 market-ingest 다.
  # 스키마는 market-core 의 Flyway 마이그레이션이다. 두 앱 모두 기동 시 적용을 시도하고, Flyway 잠금이 한쪽만 적용하게 한다.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_MARKET_DATABASE:wts_market}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:wts}
    password: ${MYSQL_PASSWORD:wts}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: market-service-pool
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

  # Valkey – 최신 시세/호가 · 현재 1분봉 읽기, WebSocket fan-out 구독 (CLAUDE.md §18, §66.3)
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 2s

market:
  # 화면이 보는 종목을 Valkey에 시청 수요로 기록한다 (CLAUDE.md §57.2, §67).
  # market-ingest가 읽어 실제 시세를 받지 않는 종목의 모의 시세를 만든다.
  demand:
    # 기록 하나의 수명. 화면을 닫은 뒤 이만큼 지나면 모의 시세도 멈춘다. 하트비트보다 넉넉히 길게 둔다.
    viewer-ttl: 30s
    # 구독 중인 종목의 수요를 다시 기록하는 주기
    heartbeat-ms: 10000
  # 브라우저 WebSocket (CLAUDE.md §68)
  websocket:
    # 종료할 때 DRAIN 뒤 클라이언트가 새 연결로 옮겨 가기를 기다리는 최대 시간. 지나면 남은 세션을 1001로 닫는다.
    # preStop 10s + 이 값 + graceful shutdown 20s 가 terminationGracePeriodSeconds(45s) 안에 들어가야 한다.
    drain-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        # prometheus: 클러스터 안에서만 닿는다 (frontend nginx는 /api · /ws만, gateway 라우트도 /api/** · /ws/**만 넘긴다)
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # 요청 지연 분위수(p95 · p99)를 Prometheus에서 계산하려면 히스토그램 버킷이 필요하다.
        # 점이 든 키는 대괄호로 감싼다. 그래야 "http.server.requests" 한 키로 바인딩된다.
        "[http.server.requests]": true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
