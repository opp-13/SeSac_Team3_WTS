// 시세 조회 앱(api). 사용자 수에 맞춰 늘어난다 (HPA, CLAUDE.md §66, ADR-0022).
//   REST (종목 · 현재가 · 호가 · 1분봉), WebSocket 송신 (Valkey pub/sub 구독 → 자기 세션)
// 시세를 만들지 않는다. KIS · Kafka 를 쓰지 않는다. 수집은 market-ingest 가 한다.
dependencies {
    implementation project(':common')
    implementation project(':market-core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // OpenAPI 3 명세 + Swagger UI. 컨트롤러에서 생성한다.
    implementation libs.springdoc.openapi
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Prometheus 수집용 /actuator/prometheus (부하 점검, CLAUDE.md §63 Phase 10 관측성)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}
