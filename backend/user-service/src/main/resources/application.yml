server:
  port: ${USER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_USER_DATABASE:wts_user}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:wts}
    password: ${MYSQL_PASSWORD:wts}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: user-service-pool
      maximum-pool-size: 10

  # 스키마는 Flyway 마이그레이션으로만 바꾼다 (ADR-0004).
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # 자동 DDL은 쓰지 않는다. 엔티티와 실제 스키마가 어긋나면 기동 단계에서 실패시킨다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Backend는 UTC로 저장한다 (CLAUDE.md §43)
        jdbc.time_zone: UTC
        format_sql: true

wts:
  auth:
    # gateway-service와 같은 값을 써야 토큰 검증이 통과한다.
    secret: ${AUTH_TOKEN_SECRET}
    token-ttl: ${AUTH_TOKEN_TTL:24h}

user:
  watchlist:
    # 사용자당 담을 수 있는 관심종목 수. 무한정 쌓이지 않게 한다.
    max-size: ${USER_WATCHLIST_MAX_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        # prometheus: 클러스터 안에서만 닿는다 (frontend nginx는 /api · /ws만, gateway 라우트도 /api/** · /ws/**만 넘긴다)
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        # 요청 지연 분위수(p95 · p99)를 Prometheus에서 계산하려면 히스토그램 버킷이 필요하다.
        # 점이 든 키는 대괄호로 감싼다. 그래야 "http.server.requests" 한 키로 바인딩된다.
        "[http.server.requests]": true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
