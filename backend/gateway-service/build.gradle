// 클라이언트 Ingress 전용 (CLAUDE.md §6.1)
// 주의: KIS OpenAPI 호출을 중계하지 않는다 (§0-9).
// Gateway는 WebFlux 기반이므로 spring-boot-starter-web을 추가하지 않는다.
dependencies {
    implementation project(':common')

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    // Prometheus 수집용 /actuator/prometheus (부하 점검, CLAUDE.md §63 Phase 10 관측성)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}
